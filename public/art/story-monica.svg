<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" width="720" height="1000" role="img" aria-labelledby="title desc">
<title id="title">Monica — Thời Gian Không Chờ Ai</title>
<desc id="desc">Không có người trong tranh: đồng hồ thời gian gần nửa đêm, tài liệu nghiên cứu đã hoàn tất, bình mực, bút lông và đồng hồ cát cạnh cửa sổ bình minh trong Học viện Ma pháp.</desc>
<defs>
