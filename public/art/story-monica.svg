<radialGradient id="mLamp"><stop stop-color="#f8dfb0" stop-opacity=".65"/><stop offset="1" stop-color="#efa975" stop-opacity="0"/></radialGradient>
<linearGradient id="mWood" x2="0" y2="1"><stop stop-color="#795344"/><stop offset=".55" stop-color="#3d2b33"/><stop offset="1" stop-color="#1a1b2c"/></linearGradient>
