<radialGradient id="mMagic"><stop stop-color="#dffffd"/><stop offset=".4" stop-color="#8cdbd7" stop-opacity=".48"/><stop offset="1" stop-color="#5db7d0" stop-opacity="0"/></radialGradient>
<linearGradient id="mGlass" x2="1" y2="1"><stop stop-color="#e3fbf0" stop-opacity=".58"/><stop offset=".4" stop-color="#7ec1d3" stop-opacity=".14"/><stop offset="1" stop-color="#dcf5ed" stop-opacity=".66"/></linearGradient>
