<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ogre’s Bane — Bình minh sau lưỡi kiếm</title>
  <desc id="desc">Thanh đại kiếm đen đỏ hình lưỡi liềm, trái tim ma lực tím hồng và xích đứt, nằm giữa màn đêm cùng bình minh trên biển.</desc>
  <defs>
    <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#080c20"/><stop offset=".52" stop-color="#342347"/><stop offset="1" stop-color="#9c5c43"/></linearGradient>
    <linearGradient id="dawn" y2="1" x2="0"><stop stop-color="#ffe4b0" stop-opacity=".75"/><stop offset="1" stop-color="#e98857" stop-opacity="0"/></linearGradient>
    <linearGradient id="steel" x2=".9" y2="1"><stop stop-color="#41414e"/><stop offset=".32" stop-color="#15151f"/><stop offset=".65" stop-color="#391a31"/><stop offset="1" stop-color="#0b111d"/></linearGradient>
    <linearGradient id="edge" x2="1" y2="1"><stop stop-color="#ffb8da"/><stop offset=".35" stop-color="#f02764"/><stop offset="1" stop-color="#631931"/></linearGradient>
    <radialGradient id="core"><stop stop-color="#fff9ff"/><stop offset=".18" stop-color="#ffb6f4"/><stop offset=".5" stop-color="#fb3bba"/><stop offset="1" stop-color="#8c174f" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo"><stop stop-color="#bc389b" stop-opacity=".35"/><stop offset="1" stop-color="#6f205f" stop-opacity="0"/></radialGradient>
    <linearGradient id="shade" x2="0" y2="1"><stop offset=".38" stop-color="#07121b" stop-opacity="0"/><stop offset="1" stop-color="#07121b"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
    <pattern id="stars" width="113" height="137" patternUnits="userSpaceOnUse"><circle cx="20" cy="26" r="1" fill="#f6d6ff" opacity=".65"/><circle cx="82" cy="94" r=".7" fill="#fff1bd" opacity=".55"/></pattern>
  </defs>
