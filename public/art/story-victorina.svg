<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" width="720" height="1000" role="img" aria-labelledby="title desc">
<title id="title">Victorina — Hoa Hồng Không Cúi Đầu</title>
<desc id="desc">Không có người trong tranh: chiếc khiên hoa hồng của Victorina bảo vệ tiền đồn nơi bình minh, lá thư niêm phong của cha và những mũi tên bị bẻ gãy kể lời thề một nữ kỵ sĩ.</desc>
<defs>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".068"/></feComponentTransfer><feBlend in="SourceGraphic" mode="soft-light"/></filter>
<filter id="glow"><feGaussianBlur stdDeviation="13"/></filter>
<filter id="smallGlow"><feGaussianBlur stdDeviation="5"/></filter>

<linearGradient id="vSky" x2="0" y2="1"><stop stop-color="#141a2c"/><stop offset=".42" stop-color="#3c3949"/><stop offset=".79" stop-color="#944b4a"/><stop offset="1" stop-color="#e0a67c"/></linearGradient>
<radialGradient id="vDawn"><stop stop-color="#ffe6ba"/><stop offset=".34" stop-color="#f4c29d" stop-opacity=".65"/><stop offset="1" stop-color="#e78879" stop-opacity="0"/></radialGradient>
<linearGradient id="vStone" x2=".6" y2="1"><stop stop-color="#5b5c65"/><stop offset="1" stop-color="#191e2b"/></linearGradient>
<linearGradient id="vShield" x2="1" y2="1"><stop stop-color="#fff2d4"/><stop offset=".22" stop-color="#bbaeb0"/><stop offset=".49" stop-color="#48566d"/><stop offset=".75" stop-color="#697585"/><stop offset="1" stop-color="#252c3e"/></linearGradient>
<linearGradient id="vCrimson" x2="1" y2="1"><stop stop-color="#ef9d88"/><stop offset=".26" stop-color="#ac3d52"/><stop offset=".65" stop-color="#63233b"/><stop offset="1" stop-color="#351d37"/></linearGradient>
<linearGradient id="vGold" x2="1" y2="1"><stop stop-color="#ffe7af"/><stop offset=".55" stop-color="#d6a96a"/><stop offset="1" stop-color="#80563e"/></linearGradient>
<linearGradient id="vScroll" x2=".6" y2="1"><stop stop-color="#f5e5bd"/><stop offset="1" stop-color="#bba07b"/></linearGradient>
<radialGradient id="vBloom"><stop stop-color="#ff99a6" stop-opacity=".45"/><stop offset="1" stop-color="#b52e52" stop-opacity="0"/></radialGradient>
</defs>

