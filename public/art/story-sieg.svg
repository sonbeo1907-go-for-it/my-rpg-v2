<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" width="720" height="1000" role="img" aria-labelledby="title desc">
<title id="title">Sieg — Nơi Dòng Sông Gọi Là Nhà</title>
<desc id="desc">Không có người trong tranh: thanh kiếm Ngân Triều đặt bên cây cầu làng, bát canh nóng và đèn lồng soi dòng sông dưới những ngọn núi quê hương elf.</desc>
<defs>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".068"/></feComponentTransfer><feBlend in="SourceGraphic" mode="soft-light"/></filter>
<filter id="glow"><feGaussianBlur stdDeviation="13"/></filter>
<filter id="smallGlow"><feGaussianBlur stdDeviation="5"/></filter>

<linearGradient id="sSky" x2="0" y2="1"><stop stop-color="#172746"/><stop offset=".35" stop-color="#385a80"/><stop offset=".65" stop-color="#c48d86"/><stop offset="1" stop-color="#e9c49a"/></linearGradient>
<radialGradient id="sSun"><stop stop-color="#fff4ce"/><stop offset="1" stop-color="#fac693"/></radialGradient>
<linearGradient id="sWater" x2="0" y2="1"><stop stop-color="#587b91"/><stop offset=".6" stop-color="#24445b"/><stop offset="1" stop-color="#10293c"/></linearGradient>
<linearGradient id="sWood" x2="1" y2="1"><stop stop-color="#87684f"/><stop offset=".47" stop-color="#4f403d"/><stop offset="1" stop-color="#292a31"/></linearGradient>
<linearGradient id="sSteel" x2="1" y2="1"><stop stop-color="#e8f5ee"/><stop offset=".38" stop-color="#a8cbd5"/><stop offset=".7" stop-color="#486b84"/><stop offset="1" stop-color="#eef1d9"/></linearGradient>
<radialGradient id="sWarm"><stop stop-color="#ffdc9e" stop-opacity=".64"/><stop offset="1" stop-color="#f5ad70" stop-opacity="0"/></radialGradient>
<linearGradient id="sBowl" x2="1" y2="1"><stop stop-color="#ddc7a3"/><stop offset="1" stop-color="#82685d"/></linearGradient>
</defs>

