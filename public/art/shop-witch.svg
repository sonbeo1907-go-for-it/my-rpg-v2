<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <title>Tiệm Prisma sau giờ đóng cửa</title>
  <desc>Tiệm thuốc cũ trong ánh sáng xanh xám, những kệ chai lọ, sổ sách và một cô phù thủy tóc bạc đang chống má sau quầy.</desc>
